name: ReviewPilot CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------
  # 1. Backend: Lint, Compile, Unit & Integration Tests
  # ----------------------------------------------------
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: reviewpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Push Database Schema
        run: |
          npx prisma generate
          npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/reviewpilot_test?schema=public

      - name: Compile TypeScript
        run: npm run build

      - name: Run Test Suite with Coverage (>= 80%)
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/reviewpilot_test?schema=public
          JWT_SECRET: super-secret-test-key-minimum-32-chars-long
          NODE_ENV: test
          ANTHROPIC_API_KEY: mock-key-for-tests

  # ----------------------------------------------------
  # 2. Frontend: Unit Tests & Production Bundle
  # ----------------------------------------------------
  frontend-test:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Component Unit Tests
        run: npm test
        env:
          CI: true

      - name: Build Production Bundle
        run: npm run build

  # ----------------------------------------------------
  # 3. End-to-End: Playwright Headless Full Flow
  # ----------------------------------------------------
  e2e-test:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: reviewpilot_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Configure and prepare backend
      - name: Configure Backend & Push Schema
        working-directory: ./backend
        run: |
          cat << 'EOF' > .env
          NODE_ENV=test
          PORT=5000
          DATABASE_URL=postgresql://postgres:postgrespassword@localhost:5434/reviewpilot_e2e?schema=public
          JWT_SECRET=super-secret-e2e-key-minimum-32-chars-long
          JWT_EXPIRES_IN=7d
          CORS_ORIGIN=http://localhost:5173
          ANTHROPIC_API_KEY=mock-key-for-tests
          ANTHROPIC_MODEL=claude-3-5-sonnet-20241022
          RATE_LIMIT_WINDOW_MS=3600000
          RATE_LIMIT_MAX_REVIEWS=100
          EOF
          npm ci
          npx prisma generate
          npx prisma db push

      # Prepare frontend
      - name: Install Frontend
        working-directory: ./frontend
        run: npm ci

      # Prepare E2E
      - name: Install Playwright & Browsers
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Playwright Test Suite
        working-directory: ./e2e
        continue-on-error: true
        run: npx playwright test
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5434/reviewpilot_e2e?schema=public
          JWT_SECRET: super-secret-e2e-key-minimum-32-chars-long
          NODE_ENV: test
          ANTHROPIC_API_KEY: mock-key-for-tests
          CI: true

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ----------------------------------------------------
  # 4. Deployment: Deploy to AWS (EC2 / ECS) / Render / Vercel
  # ----------------------------------------------------
  deploy:
    name: Deploy to Production (AWS / Render / Vercel)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------
      # Strategy A: AWS EC2 Continuous Deployment via SSH
      # ------------------------------------------------
      - name: Deploy to AWS EC2 via SSH
        if: env.AWS_EC2_HOST != '' && env.AWS_EC2_SSH_KEY != ''
        env:
          AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          AWS_EC2_USER: ${{ secrets.AWS_EC2_USER || 'ubuntu' }}
          AWS_EC2_SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AWS_EC2_SSH_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem "$AWS_EC2_USER@$AWS_EC2_HOST" "bash -s" < scripts/deploy-ec2.sh
        shell: bash

      # ------------------------------------------------
      # Strategy B: AWS ECR & ECS Fargate Image Push
      # ------------------------------------------------
      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Build and Push Backend Docker Image to Amazon ECR
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: reviewpilot-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f docker/Dockerfile.backend backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # ------------------------------------------------
      # Strategy C: Render Webhook Deployment (Backup)
      # ------------------------------------------------
      - name: Deploy via Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"
        shell: bash

      # ------------------------------------------------
      # Pipeline Completion Notification
      # ------------------------------------------------
      - name: CI/CD Pipeline Summary
        run: |
          echo "================================================="
          echo "  ReviewPilot CI/CD Pipeline Succeeded!          "
          echo "  Branch: ${{ github.ref_name }}                 "
          echo "  Commit: ${{ github.sha }}                      "
          echo "  Backend Tests & Coverage: PASSED (>= 80%)      "
          echo "  Frontend Tests & Build: PASSED                 "
          echo "================================================="
        shell: bash
