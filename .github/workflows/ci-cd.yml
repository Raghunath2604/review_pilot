name: ReviewPilot CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------
  # 1. Backend: Lint, Compile, Unit & Integration Tests
  # ----------------------------------------------------
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: reviewpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Push Database Schema
        run: |
          npx prisma generate
          npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/reviewpilot_test?schema=public

      - name: Compile TypeScript
        run: npm run build

      - name: Run Test Suite with Coverage (>= 80%)
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/reviewpilot_test?schema=public
          JWT_SECRET: super-secret-test-key-minimum-32-chars-long
          NODE_ENV: test
          ANTHROPIC_API_KEY: mock-key-for-tests

  # ----------------------------------------------------
  # 2. Frontend: Unit Tests & Production Bundle
  # ----------------------------------------------------
  frontend-test:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Component Unit Tests
        run: npm test
        env:
          CI: true

      - name: Build Production Bundle
        run: npm run build

  # ----------------------------------------------------
  # 3. End-to-End: Playwright Headless Full Flow
  # ----------------------------------------------------
  e2e-test:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: reviewpilot_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Configure and prepare backend
      - name: Configure Backend & Push Schema
        working-directory: ./backend
        run: |
          cat << 'EOF' > .env
          NODE_ENV=test
          PORT=5000
          DATABASE_URL=postgresql://postgres:postgrespassword@localhost:5434/reviewpilot_e2e?schema=public
          JWT_SECRET=super-secret-e2e-key-minimum-32-chars-long
          JWT_EXPIRES_IN=7d
          CORS_ORIGIN=http://localhost:5173
          ANTHROPIC_API_KEY=mock-key-for-tests
          ANTHROPIC_MODEL=claude-3-5-sonnet-20241022
          RATE_LIMIT_WINDOW_MS=3600000
          RATE_LIMIT_MAX_REVIEWS=100
          EOF
          npm ci
          npx prisma generate
          npx prisma db push

      # Prepare frontend
      - name: Install Frontend
        working-directory: ./frontend
        run: npm ci

      # Prepare E2E
      - name: Install Playwright & Browsers
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Playwright Test Suite
        working-directory: ./e2e
        run: npx playwright test
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5434/reviewpilot_e2e?schema=public
          JWT_SECRET: super-secret-e2e-key-minimum-32-chars-long
          NODE_ENV: test
          ANTHROPIC_API_KEY: mock-key-for-tests
          CI: true

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ----------------------------------------------------
  # 4. Deployment: Deploy to AWS / Render on merge to main
  # ----------------------------------------------------
  deploy:
    name: Deploy to Production (AWS / Render)
    runs-on: ubuntu-latest
    needs: [e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
        shell: bash
