name: ReviewPilot CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------
  # 1. Backend: Lint, Compile, Unit & Integration Tests
  # ----------------------------------------------------
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: reviewpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Compile TypeScript
        run: npm run build

      - name: Run Test Suite with Coverage (>= 80%)
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/reviewpilot_test?schema=public
          JWT_SECRET: super-secret-test-key-minimum-32-chars-long
          NODE_ENV: test
          ANTHROPIC_API_KEY: mock-key-for-tests

  # ----------------------------------------------------
  # 2. Frontend: Unit Tests & Production Bundle
  # ----------------------------------------------------
  frontend-test:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Component Unit Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

  # ----------------------------------------------------
  # 3. End-to-End: Playwright Headless Full Flow
  # ----------------------------------------------------
  e2e-test:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: reviewpilot_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Prepare backend
      - name: Install Backend & Push Schema
        working-directory: ./backend
        run: |
          npm ci
          npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5434/reviewpilot_e2e?schema=public
          JWT_SECRET: super-secret-e2e-key-minimum-32-chars-long
          NODE_ENV: test
          ANTHROPIC_API_KEY: mock-key-for-tests

      # Prepare frontend
      - name: Install Frontend
        working-directory: ./frontend
        run: npm ci

      # Prepare E2E
      - name: Install Playwright & Browsers
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Playwright Test Suite
        working-directory: ./e2e
        run: npx playwright test
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5434/reviewpilot_e2e?schema=public
          JWT_SECRET: super-secret-e2e-key-minimum-32-chars-long
          NODE_ENV: test
          ANTHROPIC_API_KEY: mock-key-for-tests
          CI: true

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ----------------------------------------------------
  # 4. Deployment: Deploy to AWS / Render on merge to main
  # ----------------------------------------------------
  deploy:
    name: Deploy to Production (AWS / Render)
    runs-on: ubuntu-latest
    needs: [e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Optional ECS / EC2)
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy via Docker Compose on AWS EC2
        if: env.AWS_EC2_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/ReviewPilot
            git pull origin main
            docker compose -f docker/docker-compose.yml up -d --build

      - name: Fallback Deployment (Render Deploy Hook)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        shell: bash
