services:
  postgres:
    image: postgres:16-alpine
    container_name: reviewpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: reviewpilot
    ports:
      - "5434:5432"
    volumes:
      - reviewpilot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reviewpilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reviewpilot-network

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: reviewpilot-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/reviewpilot?schema=public
      JWT_SECRET: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTUxNjIzOTAyMn0.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-mock-key-for-development}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      RATE_LIMIT_WINDOW_MS: 3600000
      RATE_LIMIT_MAX_REVIEWS: 10
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reviewpilot-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: reviewpilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - reviewpilot-network

volumes:
  reviewpilot_pg_data:

networks:
  reviewpilot-network:
    driver: bridge
